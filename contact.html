    <h1>Contact Us:</h1>
    <form name="contact" id="contact" method="post" action="/submit" autocomplete="on">

    <!-- Groups related fields and labels together inside a form -->
    <fieldset>
        <!-- Creates a title for group content -->
    <legend>Contact us</legend>

        <label for="name">Full name</label><br>
        <input type="text" id="name" name="name" required maxlength="60"><br><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="topic">Topic</label><br>
        <!-- Drop down menu -->
        <select id="topic" name="topic"><br><br>

            <!-- Drop down menu options -->
            <option value="support">Support</option>
            <option value="sales">Sales</option>
            <option value="general">General</option>

        </select>
        <!-- Button for submission -->
        <input type="submit" value="Send">

    </fieldset>
    </form>
